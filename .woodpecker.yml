steps:
  - name: build
    image: node:20-alpine
    commands:
      - npm ci
      - npm run build:gh

  - name: deploy
    image: bitnami/git:latest
    secrets: [codeberg_token]
    commands:
      - git config --global user.email "ci@woodpecker"
      - git config --global user.name "Woodpecker CI"
      - git clone --branch pages https://codeberg.org/${CI_REPO}.git _pages || git clone https://codeberg.org/${CI_REPO}.git _pages
      - cd _pages
      - git checkout pages 2>/dev/null || git checkout --orphan pages
      - git rm -rf . 2>/dev/null || true
      - cp -r ../dist/. .
      - git add -A
      - git commit -m "deploy ${CI_COMMIT_SHA}" || echo "Nothing to commit"
      - git push "https://oauth2:${CODEBERG_TOKEN}@codeberg.org/${CI_REPO}.git" HEAD:pages

when:
  branch: main
  event: push
